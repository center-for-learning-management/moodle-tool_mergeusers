# Caller workflow - lives in the TARGET repository at:
#   .github/workflows/pull_upstream.yml
#
# All settings live in .github/upstream/config.env in this same repo.
# Adjust the "uses:" line below to point at your common repo + ref (branch/tag/sha).
 
name: Sync from upstream
 
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pull upstream.yml'
      - '.github/upstream/**'
    branches:
      - main
 
jobs:
  sync:
    uses: center-for-learning-management/eduvidual-documentation/.github/shared-workflows/sync-upstream.yml@main
    secrets:
      BOT_GITHUB_ACTION_PAT: ${{ secrets.BOT_GITHUB_ACTION_PAT }}
